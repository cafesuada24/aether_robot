controller_manager:
  ros__parameters:
    update_rate: 30
    # use_sim_time: true

    wheel_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

wheel_controller:
  ros__parameters:
    publish_rate: 50.0

    left_wheel_names: ['wheel_front_left_joint']
    right_wheel_names: ['wheel_front_right_joint']

    wheel_separation: 0.212
    wheel_radius: 0.0325

    linear.x.max_velocity: 0.8
    linear.x.min_velocity: -0.8
    linear.x.max_acceleration: 5.0
    linear.x.max_deceleration: -5.0
    linear.x.max_acceleration_reverse: -2.0
    linear.x.max_deceleration_reverse: 2.0
    
    # odom_frame_id: odom
    # base_frame_id: base_link
  

